# Include this file from Apache httpd.conf or the active VirtualHost.
# RequestReadTimeout is server/vhost-only and must not be placed in .htaccess.
Timeout 30
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 2

<IfModule reqtimeout_module>
    RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500
</IfModule>

<IfModule mpm_winnt_module>
    ThreadsPerChild 250
    MaxConnectionsPerChild 10000
</IfModule>

<Directory "C:/path/to/Web">
    AllowOverride FileInfo Limit
    Options -Indexes
</Directory>
