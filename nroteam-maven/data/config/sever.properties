# =====================
# SERVER CONFIGURATION
# =====================

server.local=false
server.test=false
server.daoautoupdater=false
server.sv=1
server.name=Nro Luna
server.ip=127.0.0.1
server.port=14445
server.bind.ip=127.0.0.1
server.sv1=Nro Luna:127.0.0.1:14445:0

server.waitlogin=0
server.maxperip=20
server.maxplayer=10000
server.expserver=1
server.behindfirewall=false

# =====================
# NETTY DDOS PROXY
# true = Netty proxy on :14445, backend on :14446
# false = Network.java listen truc tiep tren :14445
# =====================
server.usenettyproxy=true
server.backendport=14446

# =====================
# DATABASE CONFIGURATION
# =====================

database.driver=com.mysql.cj.jdbc.Driver
database.host=localhost
database.port=3306
database.name=nro
database.user=root
database.pass=

# OPTIMIZED: Increased connection pool size for better performance
# Old: min=1, max=1 (VERY LIMITED!)
# New: min=10, max=30 (Better for concurrent players)
database.min=10
database.max=30

# OPTIMIZED: Increased connection lifetime from 2 minutes to 30 minutes
# Reduces overhead of creating new connections
database.lifetime=1800000

# NOTE: If you want to rollback, change back to:
# database.min=1
# database.max=1
# database.lifetime=120000

# Enable database query logging (set to false for production)
database.log=false

# =====================
# AUTO MAINTENANCE
# =====================

auto.maintenance=0
auto.maintenance.hour=8
auto.maintenance.minute=23
